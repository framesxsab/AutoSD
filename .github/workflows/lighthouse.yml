name: lighthouse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Lighthouse artifact integrity
        run: node scripts/verify-lighthouse-digest.mjs
      - run: npm run build
      - name: Start preview
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173 --timeout 30000
      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173 --only-categories=accessibility,performance --output=json --output-path=./lighthouse.json --chrome-flags="--headless --no-sandbox --disable-gpu" --quiet
          node scripts/lighthouse-gate.mjs ./lighthouse.json
          # Verification: exact artifact pinned via package-lock.json (lighthouse 12.8.2, wait-on 8.0.3, integrity SHA512). See docs/CONTRIBUTOR_SAFETY.md.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse.json
