name: evaluation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run evaluate
      - name: Check baseline / regression gate
        run: node scripts/check-evaluation-baseline.mjs
      - name: Validate artifact schema
        run: node scripts/run-evaluation.mjs --validate evaluation-output/evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evaluation-artifacts
          retention-days: 30
          path: |
            evaluation-output/evaluation.json
            evaluation-output/evaluation.md
            evaluation-output/environment.json
