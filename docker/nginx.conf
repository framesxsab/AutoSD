# AutoSD — nginx config for the static SPA (non-root, port 8080)

limit_req_zone $binary_remote_addr zone=autosd_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=autosd_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=autosd_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;

    # Do not advertise version/platform.
    server_tokens off;
    client_max_body_size 2m;

    limit_conn autosd_conn 20;
    limit_req zone=autosd_general burst=20 nodelay;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), hid=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Inline <style> in index.html requires 'unsafe-inline' for styles only.
    # connect-src is restricted to 'self' so the browser never sends keys to api.openai.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Never serve dotfiles or env files even if they leak into the context.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Static assets ----------------------------------------------------------
    # Vite emits content-hashed filenames under assets/ — cache forever.
    # Repeat security headers here because nginx location-level add_header
    # overrides parent server-level add_header directives.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), hid=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # --- SPA fallback -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Readiness endpoint for probes ------------------------------------------
    # Static file must exist in dist-app (created by scripts/healthz or CI).
    location = /healthz {
        default_type application/json;
        try_files /healthz.json =503;
    }

    # --- Logging: keep out of default noisy paths -------------------------------
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
